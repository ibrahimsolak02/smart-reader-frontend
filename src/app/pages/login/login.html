<div class="auth-page-container">
  <div class="card-glass">
    <div class="card-header">
      <div class="brand-badge">
        <i class="bi bi-book-half"></i> SmartReader
      </div>
      <h2>Hoş Geldiniz</h2>
      <p>Hesabınıza giriş yaparak okumaya devam edin</p>
    </div>

    @if (errorMessage) {
      <div [class]="isAccountLocked ? 'alert-locked' : 'alert-error'">
        <i [class]="isAccountLocked ? 'bi bi-shield-lock-fill' : 'bi bi-exclamation-triangle-fill'"></i>
        <div class="alert-content">
          <span>{{ errorMessage }}</span>
          @if (isAccountLocked) {
            <div class="lockout-action">
              <a routerLink="/forgot-password" class="btn-lockout-link">
                <i class="bi bi-key-fill"></i> Şifrenizi Hemen Sıfırlayın
              </a>
            </div>
          }
        </div>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>E-posta Adresi</label>
        <input
          type="email"
          formControlName="email"
          class="input-modern"
          placeholder="adiniz@example.com"
          [attr.disabled]="isAccountLocked ? '' : null"
        >
      </div>

      <div class="form-group">
        <div class="label-row">
          <label>Şifre</label>
          <a routerLink="/forgot-password" class="forgot-link">Şifremi unuttum?</a>
        </div>
        <input
          type="password"
          formControlName="password"
          class="input-modern"
          placeholder="••••••••"
          [attr.disabled]="isAccountLocked ? '' : null"
        >
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="isLoading || countdownSeconds > 0 || isAccountLocked"
      >
        @if (isLoading) {
          <i class="bi bi-arrow-repeat spin"></i> Giriş Yapılıyor...
        } @else if (countdownSeconds > 0) {
          <i class="bi bi-hourglass-split"></i> {{ countdownSeconds }} sn sonra tekrar deneyin
        } @else if (isAccountLocked) {
          <i class="bi bi-lock-fill"></i> Hesap Kilitli
        } @else {
          <i class="bi bi-box-arrow-in-right"></i> Giriş Yap
        }
      </button>
    </form>

    <div class="card-footer">
      Hesabınız yok mu? <a routerLink="/register">Hemen Kayıt Olun</a>
    </div>
  </div>
</div>
