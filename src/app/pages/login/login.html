<div class="auth-page-container">
  <div class="card-glass">
    <div class="card-header">
      <div class="brand-badge">
        <i class="bi bi-book-half"></i> SmartReader
      </div>
      <h2>Hoş Geldiniz</h2>
      <p>Hesabınıza giriş yaparak okumaya devam edin</p>
    </div>

    @if (errorMessage) {
      <div class="alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>E-posta Adresi</label>
        <input
          type="email"
          formControlName="email"
          class="input-modern"
          placeholder="adiniz@example.com"
        >
      </div>

      <div class="form-group">
        <div class="label-row">
          <label>Şifre</label>
          <a routerLink="/forgot-password" class="forgot-link">Şifremi unuttum?</a>
        </div>
        <input
          type="password"
          formControlName="password"
          class="input-modern"
          placeholder="••••••••"
        >
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        @if (isLoading) {
          <i class="bi bi-arrow-repeat spin"></i> Giriş Yapılıyor...
        } @else {
          <i class="bi bi-box-arrow-in-right"></i> Giriş Yap
        }
      </button>
    </form>

    <div class="card-footer">
      Hesabınız yok mu? <a routerLink="/register">Hemen Kayıt Olun</a>
    </div>
  </div>
</div>
