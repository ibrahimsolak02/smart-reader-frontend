<div class="auth-page-container">
  <div class="card-glass">
    <div class="card-header">
      <div class="brand-badge">
        <i class="bi bi-shield-lock"></i> SmartReader
      </div>
      <h2>Şifremi Unuttum</h2>
      <p>Kayıtlı e-posta adresinizi girin, size 6 haneli sıfırlama kodunu gönderelim</p>
    </div>

    @if (errorMessage) {
      <div class="alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    @if (successMessage) {
      <div class="alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ successMessage }}</span>
      </div>
    }

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>E-posta Adresi</label>
        <input
          type="email"
          formControlName="email"
          class="input-modern"
          placeholder="adiniz@example.com"
        >
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        @if (isLoading) {
          <i class="bi bi-arrow-repeat spin"></i> Kod Gönderiliyor...
        } @else {
          <i class="bi bi-send"></i> Sıfırlama Kodu Gönder
        }
      </button>
    </form>

    <div class="card-footer">
      Şifrenizi hatırladınız mı? <a routerLink="/login">Giriş Yapın</a>
    </div>
  </div>
</div>
