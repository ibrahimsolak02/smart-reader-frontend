<div class="auth-page-container">
  <div class="card-glass">
    <div class="card-header">
      <div class="brand-badge">
        <i class="bi bi-shield-lock-fill"></i> Güvenlik Doğrulaması
      </div>
      <h2>Hesabı Doğrula</h2>
      <p>
        <strong style="color: var(--text-main);">{{ email }}</strong> adresine gönderilen 6 haneli doğrulama kodunu girin.
      </p>
    </div>

    @if (errorMessage) {
      <div class="alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    @if (resendMessage) {
      <div class="alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ resendMessage }}</span>
      </div>
    }

    <div class="form-group">
      <input
        type="text"
        [(ngModel)]="code"
        maxlength="6"
        class="input-modern otp-input"
        placeholder="••••••"
      />
    </div>

    <button
      (click)="onVerify()"
      [disabled]="code.length !== 6 || isLoading"
      class="btn-primary"
    >
      @if (isLoading) {
        <i class="bi bi-arrow-repeat spin"></i> Doğrulanıyor...
      } @else {
        <i class="bi bi-shield-check"></i> Hesabı Doğrula
      }
    </button>

    <div class="card-footer">
      Kod ulaşmadı mı?
      <button
        class="btn-link"
        (click)="onResend()"
        [disabled]="resendDisabled"
      >
        Tekrar Kod Gönder
      </button>
    </div>
  </div>
</div>
