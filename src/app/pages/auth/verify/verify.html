<div class="auth-container">
  <div class="auth-card">
    <h2>Hesabı Doğrula</h2>

    <p class="instruction-text">
      <b>{{ email }}</b> adresine gönderilen 6 haneli doğrulama kodunu girin.
    </p>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div class="form-group">
      <input
        type="text"
        [(ngModel)]="code"
        maxlength="6"
        class="otp-input"
        placeholder="••••••"
      />
    </div>

    <button
      (click)="onVerify()"
      [disabled]="code.length !== 6 || isLoading"
      class="btn-primary">
      {{ isLoading ? 'Doğrulanıyor...' : 'Doğrula' }}
    </button>

    @if (resendMessage) {
      <div class="success-message">{{ resendMessage }}</div>
    }

    <p class="auth-footer">
      Kod gelmedi mi?
      <button
        class="btn-link"
        (click)="onResend()"
        [disabled]="resendDisabled">
        Tekrar Gönder
      </button>
    </p>

  </div>
</div>
