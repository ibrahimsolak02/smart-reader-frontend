<div class="auth-page-container">
  <div class="card-glass">
    <div class="card-header">
      <div class="brand-badge">
        <i class="bi bi-key-fill"></i> SmartReader
      </div>
      <h2>Yeni Şifre Belirleyin</h2>
      <p>E-postanıza gelen 6 haneli kodu ve yeni şifrenizi girin</p>
    </div>

    @if (errorMessage) {
      <div class="alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    @if (successMessage) {
      <div class="alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ successMessage }}</span>
      </div>
    }

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>E-posta Adresi</label>
        <input
          type="email"
          formControlName="email"
          class="input-modern"
          placeholder="adiniz@example.com"
        >
      </div>

      <div class="form-group">
        <label>6 Haneli Sıfırlama Kodu</label>
        <input
          type="text"
          formControlName="code"
          class="input-modern code-input"
          placeholder="123456"
          maxlength="6"
        >
      </div>

      <div class="form-group">
        <label>Yeni Şifre</label>
        <input
          type="password"
          formControlName="newPassword"
          class="input-modern"
          placeholder="En az 6 karakter"
        >
      </div>

      <div class="form-group">
        <label>Yeni Şifre (Tekrar)</label>
        <input
          type="password"
          formControlName="confirmPassword"
          class="input-modern"
          placeholder="Şifrenizi tekrar girin"
        >
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        @if (isLoading) {
          <i class="bi bi-arrow-repeat spin"></i> Şifre Güncelleniyor...
        } @else {
          <i class="bi bi-check2-circle"></i> Şifreyi Güncelle
        }
      </button>
    </form>

    <div class="card-footer">
      <a routerLink="/login">Giriş Ekranına Dön</a>
    </div>
  </div>
</div>
