<div class="auth-container">
  <div class="auth-card">
    <h2>Kayıt Ol</h2>

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group-row">
        <div class="form-group">
          <label>Ad</label>
          <input type="text" formControlName="firstName" placeholder="Adınız">
        </div>
        <div class="form-group">
          <label>Soyad</label>
          <input type="text" formControlName="lastName" placeholder="Soyadınız">
        </div>
      </div>

      <div class="form-group">
        <label>E-posta</label>
        <input type="email" formControlName="email" placeholder="ornek@mail.com">
      </div>

      <div class="form-group">
        <label>Şifre</label>
        <input type="password" formControlName="password" placeholder="En az 6 karakter">
      </div>

      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Kayıt Olunuyor...' : 'Kayıt Ol' }}
      </button>
    </form>

    <p class="auth-footer">
      Zaten hesabın var mı? <a routerLink="/login">Giriş Yap</a>
    </p>
  </div>
</div>
